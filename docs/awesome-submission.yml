# awesome-dsh-plugin 提交材料（T3-5 草案）

> canonical 上游：`awesome-dsh-plugin/awesome-dsh-plugin`（勿用 `omdsh-dev` fork；提交当天用
> `gh api repos/awesome-dsh-plugin/awesome-dsh-plugin --jq '.parent'` 与 `git ls-tree -r upstream/main scripts/` 复查生成流程）。
> 流程：先双语 issue → 修改 YAML 数据源 → `node scripts/generate-readme.mjs`（勿手改 README）→ `--check` → `awesome-lint` → `build-site` → 双语 PR。

## 1. 门槛自查（提交前复核贡献指南）

- [x] `package.json` 声明 `dsh.bundle.patch` → `./cordis.patch.yml`（已声明）
- [x] 真实可用代码 + 活跃维护（T1/T2 已完成，测试 9 项全绿）
- [x] 添加 `dsh-plugin` GitHub topic（T3-4 执行时配置）
- [ ] repo 年龄 ≥ 1 天、commits ≥ 10（创建后自然满足，提交当天复核）
- [x] 描述只讲事实，无营销词

## 2. 数据源 YAML 草案

粘贴到 awesome 仓库 `data/plugins/Jiyr0119__dsh-service-console.yml`（字段名以当期 schema 为准）：

```yaml
url: https://github.com/Jiyr0119/dsh-service-console
name: Jiyr0119/dsh-service-console
category: ui
description:
  en: 'Local development service console for DSH: discovers listening ports, shows service ownership, and safely inspects, stops, or restarts services related to a conversation or workspace.'
  zh: 'DSH 本地开发服务控制台：发现监听端口，展示服务归属，并安全地查看、停止或重启与对话或工作区相关的服务。'
```

- 描述以句号结尾；含 `: `（英文冒号+空格）必须加引号；避免裸 `[file: ...]` 触发 awesome-lint 引用规则。

