## 4. 执行步骤（T3-4 仓库就绪后）

```bash
# 1) 双语 issue
gh issue create --repo awesome-dsh-plugin/awesome-dsh-plugin --title "Add DSH Service Console / 新增 DSH 服务控制台" --body-file issue.md

# 2) 从 canonical 建分支
gh repo clone Jiyr0119/awesome-dsh-plugin && cd awesome-dsh-plugin
git remote add upstream https://github.com/awesome-dsh-plugin/awesome-dsh-plugin.git
git fetch upstream main
git checkout -b feat/add-dsh-service-console upstream/main

# 3) 改 YAML + 截图 → 生成/校验
npm ci
node scripts/generate-readme.mjs
node scripts/generate-readme.mjs --check
npx awesome-lint
node scripts/build-site.mjs

# 4) 提交数据源 + 生成的 README → 双语 PR
git add data/plugins README.md README.zh.md
git commit -m "Add DSH Service Console"
git push origin feat/add-dsh-service-console
gh pr create --repo awesome-dsh-plugin/awesome-dsh-plugin --base main --head Jiyr0119:feat/add-dsh-service-console --title "Add DSH Service Console / 新增 DSH 服务控制台" --body-file pr.md

# 5) 查重 + CI
gh search prs --repo awesome-dsh-plugin/awesome-dsh-plugin "Jiyr0119"
gh pr view <num> --repo awesome-dsh-plugin/awesome-dsh-plugin --json statusCheckRollup,mergeStateStatus
```

## 5. 差异化定位

对比 `DSH-better-sidebar` 等全家桶：本插件是 **standalone / single-purpose / zero-config / one-command** 的本地开发服务控制台，只做"服务发现 + 归属 + 安全控制"一件事。
